name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Typecheck shared
        working-directory: packages/shared
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Run shared tests (if any)
        working-directory: packages/shared
        run: bash -c 'bun test 2>/dev/null || echo "No tests found — skipping"'

      - name: Typecheck API
        working-directory: packages/api
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Svelte check
        working-directory: packages/app
        run: bun run check
